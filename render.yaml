services:
  - type: web
    name: checkpoint-app
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: QR_HMAC_SECRET
        generateValue: true
      - key: ORGANIZER_PROVISION_KEY
        value: checkpoint_org_key_2026
      - key: GEMINI_API_KEY
        sync: false
